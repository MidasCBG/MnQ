    }

    // ==========================================
    // 10. 실시간 카메라·머리 위 공중 뱃지 & 게임 루프
    // ==========================================
    function stopCameraAndTimers() {
      if (state.game.timerInterval) {
        clearInterval(state.game.timerInterval);
        state.game.timerInterval = null;
      }
      if (state.game.revivalTimeout) {
        clearTimeout(state.game.revivalTimeout);
        state.game.revivalTimeout = null;
      }
      if (state.game.animFrameId) {
        cancelAnimationFrame(state.game.animFrameId);
        state.game.animFrameId = null;
      }
      if (state.game.videoStream) {
        state.game.videoStream.getTracks().forEach(t => t.stop());
        state.game.videoStream = null;
      }
      state.game.cameraActive = false;
    }

    function startGameSession(quizId) {
      if (quizId) state.selectedQuizId = quizId;
      state.game.questionIndex = 0;
      state.game.paused = false;
      state.game.participants.forEach(p => { p.eliminated = false; });
      state.game.timeLeft = state.game.solveTimeSec;
      state.game.revealTimeLeft = state.game.revealMoveTimeSec;
      navigate('play');
      setTimeout(() => {
        presentCurrentQuestion();
      }, 60);
    }

    function openStudentWindow() {
      broadcastLiveSyncState();
      const url = new URL(window.location.href);
      url.searchParams.set('view', 'student');
      const popup = window.open(url.toString(), 'MoveAndQuizStudentWindow', 'width=1280,height=800');
      if (popup) {
        showToast('학생용 전용 창이 열렸습니다! 학생 화면에는 정답과 해설이 숨겨집니다.', 'success');
      } else {
        showToast('팝업 차단이 설정되어 있습니다. 브라우저 주소창 우측에서 팝업을 허용해 주세요.', 'warning');
      }
    }

    function detectFacesOnVideoFrame(video) {
      if (!state.game.cameraActive || !video || video.readyState < 2) return;
      const now = performance.now();
      if (state.game.detectBusy || now - state.game.lastDetectAt < 120) return;
      state.game.lastDetectAt = now;

      if ('FaceDetector' in window) {
        if (!state.game.faceDetector) {
          try {
            state.game.faceDetector = new window.FaceDetector({ fastMode: true, maxDetectedFaces: 25 });
          } catch (e) {
            state.game.faceDetector = null;
          }
        }
        if (state.game.faceDetector) {
          state.game.detectBusy = true;
          state.game.faceDetector.detect(video).then(faces => {
            const vw = video.videoWidth || 640;
            const vh = video.videoHeight || 480;
            state.game.detectedHeads = (faces || []).map((f, idx) => {
              const box = f.boundingBox;
              let cx = (box.x + box.width / 2) / vw;
              if (state.game.mirrorCamera) cx = 1 - cx;
              const cy = (box.y + box.height / 2) / vh;
              const hr = Math.max(0.035, (box.height / vh) * 0.55);
              return {
                id: `cam_face_${idx}`,
                label: `참가자 ${idx + 1}`,
                x: Math.min(0.98, Math.max(0.02, cx)),
                y: Math.min(0.95, Math.max(0.05, cy)),
                headRadius: hr,
                eliminated: false,
                status: 'selected',
                choiceIndex: 0,
                choiceText: ''
              };
            });
          }).catch(() => {}).finally(() => {
            state.game.detectBusy = false;
          });
          return;
        }
      }

      // FaceDetector 미지원 브라우저용 피부색·상반신 클러스터 기반 실시간 위치 추정
      try {
        if (!state.game._offCanvas) {
          state.game._offCanvas = document.createElement('canvas');
          state.game._offCanvas.width = 96;
          state.game._offCanvas.height = 72;
        }
        const oc = state.game._offCanvas;
        const octx = oc.getContext('2d', { willReadFrequently: true });
        octx.drawImage(video, 0, 0, 96, 72);
        const imgData = octx.getImageData(0, 0, 96, 72).data;
        const cols = new Array(96).fill(null).map(() => ({ count: 0, sumY: 0, minY: 72 }));
        for (let y = 4; y < 68; y++) {
          for (let x = 2; x < 94; x++) {
            const i = (y * 96 + x) * 4;
            const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
            const isSkin = r > 85 && g > 40 && b > 20 && r > g && r > b && Math.abs(r - g) > 12;
            if (isSkin) {
              cols[x].count++;
              cols[x].sumY += y;
              if (y < cols[x].minY) cols[x].minY = y;
            }
          }
        }
        const heads = [];
        let clusterStart = -1;
        for (let x = 2; x <= 94; x++) {
          const active = x < 94 && cols[x].count >= 4;
          if (active && clusterStart === -1) clusterStart = x;
          if (!active && clusterStart !== -1) {
            const width = x - clusterStart;
            if (width >= 3) {
              let totalWeight = 0, weightedX = 0, topY = 72;
              for (let cx = clusterStart; cx < x; cx++) {
                totalWeight += cols[cx].count;
                weightedX += cx * cols[cx].count;
                if (cols[cx].minY < topY) topY = cols[cx].minY;
              }
              let normX = (weightedX / totalWeight) / 96;
              if (state.game.mirrorCamera) normX = 1 - normX;
              const normY = Math.min(0.88, Math.max(0.12, (topY + width * 0.55) / 72));
              heads.push({
                id: `cam_skin_${heads.length}`,
                label: `참가자 ${heads.length + 1}`,
                x: normX,
                y: normY,
                headRadius: Math.max(0.04, (width / 96) * 0.65),
                eliminated: false,
                status: 'selected',
                choiceIndex: 0,
                choiceText: ''
              });
            }
            clusterStart = -1;
          }
        }
        state.game.detectedHeads = heads;
      } catch (e) {}
    }

    function evaluateParticipantZone(p, optionCount) {
      const margin = state.game.activeMarginRatio;
      const halfBound = state.game.boundaryWidthRatio / 2;

      if (p.x < margin || p.x > 1 - margin || p.y < margin || p.y > 1 - margin) {
        p.status = 'outside';
        p.choiceIndex = -1;
        p.choiceText = '영역 이탈!';
        return;
      }

      const activeSize = 1 - margin * 2;
      const relX = (p.x - margin) / activeSize;
      const relY = (p.y - margin) / activeSize;

      // 4지선다 2x2 사분면 배치 판정
      if (optionCount === 4 && state.game.choice4Layout === 'grid2x2') {
        const halfNorm = halfBound / activeSize;
        if (Math.abs(relX - 0.5) <= halfNorm || Math.abs(relY - 0.5) <= halfNorm) {
          p.status = 'boundary';
          p.choiceIndex = -1;
          p.choiceText = '경계선(미선택)';
          return;
        }
        const col = relX < 0.5 ? 0 : 1;
        const row = relY < 0.5 ? 0 : 1;
        const idx = row * 2 + col;
        p.status = 'selected';
        p.choiceIndex = idx;
        p.choiceText = `${idx + 1}번 선택`;
        return;
      }

      // 가로 분할 판정 (OX 2구역 또는 4지선다 가로 4구역)
      const zoneWidth = 1 / optionCount;
      for (let i = 1; i < optionCount; i++) {
        const boundaryPos = i * zoneWidth;
        if (Math.abs(relX - boundaryPos) <= halfBound / activeSize) {
          p.status = 'boundary';
          p.choiceIndex = -1;
          p.choiceText = '경계선(미선택)';
          return;
        }
      }

      const idx = Math.min(optionCount - 1, Math.max(0, Math.floor(relX / zoneWidth)));
      p.status = 'selected';
      p.choiceIndex = idx;
      p.choiceText = optionCount === 2 ? (idx === 0 ? 'O 선택' : 'X 선택') : `${idx + 1}번 선택`;
    }

    function renderStageCanvasFrame(canvas, video, optCount, correctAnswerIndex = -1, isRevealed = false) {
      const rect = canvas.getBoundingClientRect();
      if (canvas.width !== Math.floor(rect.width) || canvas.height !== Math.floor(rect.height)) {
        canvas.width = Math.floor(rect.width);
        canvas.height = Math.floor(rect.height);
      }
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      const theme = THEME_CONFIGS[state.game.theme] || THEME_CONFIGS.classic;

      ctx.clearRect(0, 0, w, h);

      // 배경(웹캠 또는 테마별 교실 스테이지 배경)
      if (state.game.cameraActive && video && video.readyState >= 2) {
        ctx.save();
        if (state.game.mirrorCamera) {
          ctx.translate(w, 0);
          ctx.scale(-1, 1);
        }
        ctx.drawImage(video, 0, 0, w, h);
        ctx.restore();
      } else {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, theme.stageBgTop);
        grad.addColorStop(1, theme.stageBgBottom);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      }

      const marginX = w * state.game.activeMarginRatio;
      const marginY = h * state.game.activeMarginRatio;
      const activeW = w - marginX * 2;
      const activeH = h - marginY * 2;
      const boundPx = w * state.game.boundaryWidthRatio;
      const is2x2 = optCount === 4 && state.game.choice4Layout === 'grid2x2';
      const zoneColors = theme.zonePalette || [
        'rgba(59, 130, 246, 0.18)',
        'rgba(168, 85, 247, 0.18)',
        'rgba(16, 185, 129, 0.18)',
        'rgba(245, 158, 11, 0.18)'
      ];

      // 카메라가 켜져 있으면 실제 카메라에서 인식된 인물 목록만 사용하고, 꺼져 있을 때만 가상 학생 표시
      if (state.game.cameraActive) {
        detectFacesOnVideoFrame(video);
      }
      const activeList = state.game.cameraActive ? state.game.detectedHeads : state.game.participants;
      activeList.forEach(p => evaluateParticipantZone(p, optCount));

      // 외곽 이탈 경고 테두리
      const hasOutside = activeList.some(p => p.status === 'outside');
      ctx.strokeStyle = hasOutside ? 'rgba(244, 63, 94, 0.9)' : 'rgba(255, 255, 255, 0.35)';
      ctx.lineWidth = hasOutside ? 6 : 2;
      ctx.strokeRect(marginX, marginY, activeW, activeH);

      const boundWarnCheck = (zx) => activeList.some(p => p.status === 'boundary' && Math.abs(p.x * w - zx) < boundPx * 2.5);
      const anyBoundaryCheck = () => activeList.some(p => p.status === 'boundary');

      if (is2x2) {
        const halfW = activeW / 2;
        const halfH = activeH / 2;
        for (let r = 0; r < 2; r++) {
          for (let c = 0; c < 2; c++) {
            const idx = r * 2 + c;
            const zx = marginX + c * halfW;
            const zy = marginY + r * halfH;
            ctx.fillStyle = zoneColors[idx % zoneColors.length];
            ctx.fillRect(zx, zy, halfW, halfH);

            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.font = '900 17px "Noto Sans KR", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`${idx + 1}번 구역`, zx + halfW / 2, zy + 28);
          }
        }
        const hasBound = anyBoundaryCheck();
        ctx.fillStyle = hasBound ? 'rgba(245, 158, 11, 0.88)' : 'rgba(255, 255, 255, 0.55)';
        ctx.fillRect(marginX + halfW - boundPx / 2, marginY, boundPx, activeH);
        ctx.fillRect(marginX, marginY + halfH - boundPx / 2, activeW, boundPx);
      } else {
        const zoneW = activeW / optCount;
        for (let i = 0; i < optCount; i++) {
          const zx = marginX + i * zoneW;
          ctx.fillStyle = zoneColors[i % zoneColors.length];
          ctx.fillRect(zx, marginY, zoneW, activeH);

          ctx.fillStyle = 'rgba(255,255,255,0.9)';
          ctx.font = '900 17px "Noto Sans KR", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(optCount === 2 ? (i === 0 ? 'O 구역' : 'X 구역') : `${i + 1}번 구역`, zx + zoneW / 2, marginY + 28);

          if (i > 0) {
            const hasBoundaryPerson = boundWarnCheck(zx);
            ctx.fillStyle = hasBoundaryPerson ? 'rgba(245, 158, 11, 0.88)' : 'rgba(255, 255, 255, 0.55)';
            ctx.fillRect(zx - boundPx / 2, marginY, boundPx, activeH);
          }
        }
      }

      // 참가자 및 머리 위 공중 플로팅 뱃지 렌더링
      const now = Date.now();
      for (const p of activeList) {
        evaluateParticipantZone(p, optCount);
        const px = p.x * w;
        const py = p.y * h;
        const headR = Math.max(20, w * p.headRadius);

        if (!state.game.cameraActive) {
          ctx.beginPath();
          ctx.arc(px, py, headR, 0, Math.PI * 2);
          ctx.fillStyle = p.eliminated ? 'rgba(100,116,139,0.2)' : 'rgba(255,255,255,0.22)';
          ctx.fill();
          ctx.strokeStyle = p.eliminated ? 'rgba(148,163,184,0.4)' : 'rgba(255,255,255,0.6)';
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.fillStyle = p.eliminated ? '#94a3b8' : '#f8fafc';
          ctx.font = '700 11px "Noto Sans KR", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(p.eliminated ? `${p.label}(탈락)` : p.label, px, py + 4);
        }

        const headTopY = py - headR;
        const badgeY = Math.max(36, headTopY - (state.game.headBadgeOffsetPx || 36));
        const isBlinkHidden = p.status === 'outside' && Math.floor(now / 260) % 2 === 1;

        if (!isBlinkHidden) {
          let badgeBg = '#2563eb';
          if (p.eliminated) badgeBg = '#475569';
          else if (p.status === 'boundary') badgeBg = '#d97706';
          else if (p.status === 'outside') badgeBg = '#e11d48';
          else if (isRevealed && correctAnswerIndex >= 0) {
            badgeBg = p.choiceIndex === correctAnswerIndex ? '#059669' : '#64748b';
          }

          const badgeText = p.eliminated ? '탈락(대기)' : p.choiceText;
          ctx.font = '900 13px "Noto Sans KR", sans-serif';
          const textW = ctx.measureText(badgeText).width;
          const pillW = textW + 24;
          const pillH = 28;

          ctx.beginPath();
          ctx.moveTo(px, headTopY - 4);
          ctx.lineTo(px, badgeY + pillH / 2);
          ctx.strokeStyle = badgeBg;
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.fillStyle = badgeBg;
          ctx.beginPath();
          ctx.roundRect(px - pillW / 2, badgeY - pillH / 2, pillW, pillH, 14);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(badgeText, px, badgeY);
        }
      }
    }

    function attachParticipantDragHandlers(canvas) {
      let draggingParticipant = null;
      const getNormCoords = (clientX, clientY) => {
        const rect = canvas.getBoundingClientRect();
        return {
          x: Math.min(0.99, Math.max(0.01, (clientX - rect.left) / rect.width)),
          y: Math.min(0.95, Math.max(0.08, (clientY - rect.top) / rect.height))
        };
      };
      canvas.onpointerdown = (e) => {
        const pos = getNormCoords(e.clientX, e.clientY);
        for (const p of state.game.participants) {
          if (Math.hypot(p.x - pos.x, p.y - pos.y) < 0.1) {
            draggingParticipant = p;
            break;
          }
        }
      };
      canvas.onpointermove = (e) => {
        if (!draggingParticipant) return;
        const pos = getNormCoords(e.clientX, e.clientY);
        draggingParticipant.x = pos.x;
        draggingParticipant.y = pos.y;
      };
      canvas.onpointerup = () => { draggingParticipant = null; };
    }

    async function toggleSettingsPreviewCamera() {
      if (state.game.cameraActive) {
        stopCameraAndTimers();
        render();
        initSettingsCameraPreview();
        return;
      }
      if (navigator.mediaDevices?.getUserMedia) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
          state.game.videoStream = stream;
          state.game.cameraActive = true;
          render();
          initSettingsCameraPreview();
          showToast('설정 미리보기 카메라가 켜졌습니다.', 'success');
        } catch (err) {
          showToast('카메라 권한을 확인할 수 없어 시뮬레이터 모드로 표시됩니다.', 'warning');
        }
      }
    }

    async function initSettingsCameraPreview() {
      const canvas = document.getElementById('settings-preview-canvas');
      const video = document.getElementById('settings-preview-video');
      if (!canvas) return;
      if (state.game.cameraActive && state.game.videoStream && video) {
        video.srcObject = state.game.videoStream;
        try { await video.play(); } catch (e) {}
      }
      attachParticipantDragHandlers(canvas);

      // 설정 미리보기 내 교사 조작 리모컨 드래그
      const sHud = document.getElementById('settings-hud-preview');
      const sHandle = document.getElementById('settings-hud-drag-handle');
      const sBox = document.getElementById('settings-preview-box');
      if (sHud && sHandle && sBox) {
        let dragOff = null;
        sHandle.onpointerdown = (e) => {
          const r = sHud.getBoundingClientRect();
          dragOff = { dx: e.clientX - r.left, dy: e.clientY - r.top };
          sHandle.setPointerCapture?.(e.pointerId);
        };
        sHandle.onpointermove = (e) => {
          if (!dragOff) return;
          const br = sBox.getBoundingClientRect();
          const nx = Math.min(Math.max(8, br.width - sHud.offsetWidth - 8), Math.max(8, e.clientX - br.left - dragOff.dx));
          const ny = Math.min(Math.max(8, br.height - sHud.offsetHeight - 8), Math.max(8, e.clientY - br.top - dragOff.dy));
          sHud.style.right = 'auto';
          sHud.style.left = `${nx}px`;
          sHud.style.top = `${ny}px`;
          state.game.hudX = Math.round(nx);
          state.game.hudY = Math.round(ny);
        };
        sHandle.onpointerup = () => {
          if (dragOff) {
            dragOff = null;
            saveUserGamePrefs();
          }
        };
      }

      if (state.game.animFrameId) cancelAnimationFrame(state.game.animFrameId);
      const previewLoop = () => {
        if (state.route !== 'settings' || state.settingsTab !== 'camera') return;
        const optCount = state.settingsPreviewMode === 'OX' ? 2 : 4;
        renderStageCanvasFrame(canvas, video, optCount, -1, false);
        state.game.animFrameId = requestAnimationFrame(previewLoop);
      };
      state.game.animFrameId = requestAnimationFrame(previewLoop);
    }

    async function initCameraAndGameLoop() {
      const canvas = document.getElementById('game-canvas');
      const video = document.getElementById('game-video');
      if (!canvas) return;

      if (!state.game.cameraActive && navigator.mediaDevices?.getUserMedia) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
          state.game.videoStream = stream;
          state.game.cameraActive = true;
          if (video) {
            video.srcObject = stream;
            await video.play();
          }
        } catch (err) {
          state.game.cameraActive = false;
        }
      }

      if (state.game.timerInterval) clearInterval(state.game.timerInterval);
      state.game.timerInterval = setInterval(() => {
        if (state.route !== 'play' || state.game.paused) return;
        const badge = document.getElementById('game-timer-badge');

        if (state.game.phase === 'answering') {
          if (state.game.timeLeft > 0) {
            state.game.timeLeft -= 1;
            if (state.game.timeLeft > 0 && state.game.timeLeft <= state.game.countdownSoundStartSec) {
              playToneBeep(state.game.timeLeft <= 3 ? 1046.5 : 784, 0.1, 'sine');
            }
            if (badge) badge.textContent = `남은 시간 ${state.game.timeLeft}초`;
          } else {
            revealCurrentAnswer();
          }
        } else if ((state.game.phase === 'revealed' || state.game.phase === 'all_eliminated_alert') && state.game.autoAdvance) {
          if (state.game.revealTimeLeft > 0) {
            state.game.revealTimeLeft -= 1;
            if (badge) badge.textContent = `정답·이동 ${state.game.revealTimeLeft}초`;
          } else {
            goToNextQuestion();
          }
        }
      }, 1000);

      // 교사 조작 리모컨(HUD) 드래그 이동 처리
      const hudEl = document.getElementById('teacher-control-hud');
      const hudHandle = document.getElementById('teacher-hud-drag-handle');
      const stageBox = document.getElementById('play-stage-box');
      if (hudEl && hudHandle && stageBox) {
        let hudDragOffset = null;
        hudHandle.onpointerdown = (e) => {
          const hudRect = hudEl.getBoundingClientRect();
          hudDragOffset = {
            dx: e.clientX - hudRect.left,
            dy: e.clientY - hudRect.top
          };
          hudHandle.setPointerCapture?.(e.pointerId);
        };
        hudHandle.onpointermove = (e) => {
          if (!hudDragOffset) return;
          const boxRect = stageBox.getBoundingClientRect();
          const maxX = Math.max(8, boxRect.width - hudEl.offsetWidth - 8);
          const maxY = Math.max(8, boxRect.height - hudEl.offsetHeight - 8);
          const nx = Math.min(maxX, Math.max(8, e.clientX - boxRect.left - hudDragOffset.dx));
          const ny = Math.min(maxY, Math.max(8, e.clientY - boxRect.top - hudDragOffset.dy));
          hudEl.style.right = 'auto';
          hudEl.style.left = `${nx}px`;
          hudEl.style.top = `${ny}px`;
          state.game.hudX = Math.round(nx);
          state.game.hudY = Math.round(ny);
        };
        hudHandle.onpointerup = () => {
          if (hudDragOffset) {
            hudDragOffset = null;
            saveUserGamePrefs();
          }
        };
      }

      attachParticipantDragHandlers(canvas);

      const drawLoop = () => {
        if (state.route !== 'play') return;
        const quiz = state.quizzes.find(q => q.id === state.selectedQuizId) || state.quizzes[0];
        const questions = getActivePlayableQuestions(quiz);
        const q = questions[state.game.questionIndex] || questions[0];
        const isRev = state.game.phase === 'revealed' || state.game.phase === 'finished';
        renderStageCanvasFrame(canvas, video, q.options.length, q.answerIndex, isRev);
        state.game.animFrameId = requestAnimationFrame(drawLoop);
      };

      state.game.animFrameId = requestAnimationFrame(drawLoop);
    }

    function render() {
      applyActiveThemeToDocument();
      broadcastLiveSyncState();
      renderAuthQuotaBar();

      document.querySelectorAll('.nav-btn').forEach(btn => {
        const active = btn.getAttribute('data-nav') === state.route;
        btn.className = active
          ? 'nav-btn px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-extrabold whitespace-nowrap transition bg-blue-600 text-white shadow-sm'
          : 'nav-btn px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-extrabold whitespace-nowrap transition bg-slate-100 hover:bg-slate-200 text-slate-700';
      });

      const main = document.getElementById('app-main');
      if (!main) return;

      if (state.route === 'home') main.innerHTML = renderHomeScreen();
      else if (state.route === 'library') main.innerHTML = renderLibraryScreen();
      else if (state.route === 'creator') main.innerHTML = renderCreatorScreen();
      else if (state.route === 'settings') main.innerHTML = renderSettingsScreen();
      else if (state.route === 'play') main.innerHTML = renderPlayScreen();

      renderModal();
    }

    window.addEventListener('storage', (e) => {
      if (e.key === 'mq_live_student_sync' && isStudentDisplayMode) {
        syncFromTeacherWindow();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      loadPersistedData();
      if (isStudentDisplayMode) {
        syncFromTeacherWindow();
        setTimeout(() => initCameraAndGameLoop(), 80);
      } else {
        render();
      }
    });
  </script>
</body>
</html>
