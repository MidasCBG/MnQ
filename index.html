    function applyActiveThemeToDocument() {
      const themeId = state.game?.theme || 'classic';
      const theme = THEME_CONFIGS[themeId] || THEME_CONFIGS.classic;
      document.body.classList.remove('theme-roblox', 'theme-pokemon', 'theme-cyber', 'theme-classic');
      document.body.classList.add(`theme-${theme.id}`);

      const navbar = document.getElementById('main-navbar');
      if (navbar) {
        if (isStudentDisplayMode) {
          navbar.classList.add('hidden');
        } else {
          navbar.className = `sticky top-0 z-40 backdrop-blur border-b shadow-sm transition-colors duration-200 ${theme.headerClass}`;
        }
      }
    }

    function broadcastLiveSyncState() {
      if (isStudentDisplayMode) return;
      try {
        const payload = {
          ts: Date.now(),
          selectedQuizId: state.selectedQuizId,
          quizzes: state.quizzes,
          game: {
            theme: state.game.theme,
            targetSurvivors: state.game.targetSurvivors,
            choice4Layout: state.game.choice4Layout,
            solveTimeSec: state.game.solveTimeSec,
            revealMoveTimeSec: state.game.revealMoveTimeSec,
            mirrorCamera: state.game.mirrorCamera,
            boundaryWidthRatio: state.game.boundaryWidthRatio,
            activeMarginRatio: state.game.activeMarginRatio,
            headBadgeOffsetPx: state.game.headBadgeOffsetPx,
            questionIndex: state.game.questionIndex,
            phase: state.game.phase,
            paused: state.game.paused,
            timeLeft: state.game.timeLeft,
            revealTimeLeft: state.game.revealTimeLeft,
            specialBannerText: state.game.specialBannerText,
            specialBannerSub: state.game.specialBannerSub
          }
        };
        localStorage.setItem('mq_live_student_sync', JSON.stringify(payload));
      } catch (e) {}
    }

    function syncFromTeacherWindow() {
      if (!isStudentDisplayMode) return;
      try {
        const raw = localStorage.getItem('mq_live_student_sync');
        if (!raw) return;
        const payload = JSON.parse(raw);
        if (payload.quizzes) state.quizzes = payload.quizzes;
        if (payload.selectedQuizId) state.selectedQuizId = payload.selectedQuizId;
        if (payload.game) Object.assign(state.game, payload.game);
        render();
      } catch (e) {}
    }

    function updateGamePref(key, value, shouldRender = true) {
      state.game[key] = value;
      if (key === 'solveTimeSec' && (state.game.phase === 'ready' || state.game.phase === 'answering')) {
        state.game.timeLeft = Number(value);
      }
      if (key === 'revealMoveTimeSec' && state.game.phase === 'revealed') {
        state.game.revealTimeLeft = Number(value);
      }
      saveUserGamePrefs();
      broadcastLiveSyncState();
      if (shouldRender) render();
    }

    function getUserPrefsStorageKey() {
      const email = state.auth?.isLoggedIn && state.auth?.user?.email
        ? state.auth.user.email.toLowerCase().trim()
        : 'guest_default';
      return `mq_user_game_prefs_${email}`;
    }

    function saveUserGamePrefs() {
      try {
        const prefsToSave = {};
        Object.keys(DEFAULT_USER_PREFS).forEach(k => {
          prefsToSave[k] = state.game[k];
        });
        localStorage.setItem(getUserPrefsStorageKey(), JSON.stringify(prefsToSave));
      } catch (e) {}
    }

    function loadUserGamePrefs() {
      try {
        const raw = localStorage.getItem(getUserPrefsStorageKey());
        const saved = raw ? JSON.parse(raw) : {};
        Object.assign(state.game, JSON.parse(JSON.stringify(DEFAULT_USER_PREFS)), saved);
        state.game.timeLeft = Number(state.game.solveTimeSec) || 15;
        state.game.revealTimeLeft = Number(state.game.revealMoveTimeSec) || 7;
      } catch (e) {
        Object.assign(state.game, JSON.parse(JSON.stringify(DEFAULT_USER_PREFS)));
      }
    }

    function loadPersistedData() {
      try {
        const savedQuizzes = localStorage.getItem('mq_quizzes_v1');
        state.quizzes = savedQuizzes ? JSON.parse(savedQuizzes) : JSON.parse(JSON.stringify(SAMPLE_QUIZZES));
        if (!state.quizzes.length) state.quizzes = JSON.parse(JSON.stringify(SAMPLE_QUIZZES));
        state.selectedQuizId = state.quizzes[0].id;

        const savedAuth = localStorage.getItem('mq_auth_v1');
        if (savedAuth) state.auth = JSON.parse(savedAuth);

        const savedQuota = localStorage.getItem('mq_quota_v1');
        if (savedQuota) Object.assign(state.quota, JSON.parse(savedQuota));

        const savedFolders = localStorage.getItem('mq_drive_folders_v1');
        if (savedFolders) state.driveBrowser.folders = JSON.parse(savedFolders);

        loadUserGamePrefs();
      } catch (err) {
        state.quizzes = JSON.parse(JSON.stringify(SAMPLE_QUIZZES));
      }
    }

    function saveQuizzes() {
      localStorage.setItem('mq_quizzes_v1', JSON.stringify(state.quizzes));
    }

    function saveAuthState() {
      localStorage.setItem('mq_auth_v1', JSON.stringify(state.auth));
    }

    function saveQuotaState() {
      localStorage.setItem('mq_quota_v1', JSON.stringify(state.quota));
    }

    function saveDriveFolders() {
      localStorage.setItem('mq_drive_folders_v1', JSON.stringify(state.driveBrowser.folders));
    }

    // ==========================================
    // 3. 공통 유틸 & 토스트 알림
    // ==========================================
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const colors = {
        info: 'bg-slate-900 text-white border-slate-700',
        success: 'bg-emerald-600 text-white border-emerald-500',
        warning: 'bg-amber-500 text-slate-950 border-amber-400',
        error: 'bg-rose-600 text-white border-rose-500'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-2xl border shadow-xl text-xs sm:text-sm font-extrabold transition-all duration-300 ${colors[type] || colors.info}`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(8px)';
        setTimeout(() => el.remove(), 300);
      }, 3200);
    }

    function navigate(route) {
      if ((state.route === 'play' || state.route === 'settings') && route !== state.route) {
        stopCameraAndTimers();
      }
      state.route = route;
      render();
      if (route === 'settings' && state.settingsTab === 'camera') {
        setTimeout(() => initSettingsCameraPreview(), 60);
      }
    }

    function switchSettingsTab(tab) {
      if (state.settingsTab === 'camera' && tab !== 'camera') {
        stopCameraAndTimers();
      }
      state.settingsTab = tab;
      render();
      if (tab === 'camera') {
        setTimeout(() => initSettingsCameraPreview(), 60);
      }
    }

    function openModal(modalName) {
      state.activeModal = modalName;
      renderModal();
      if (modalName === 'login') {
        setTimeout(() => document.getElementById('login-email-input')?.focus(), 50);
      }
    }

    function closeModal() {
      state.activeModal = null;
      renderModal();
    }

    // ==========================================
    // 4. Google 로그인 & 사용량 게이지 로직
    // ==========================================
    function detectAccountTierByEmail(email) {
      const lower = (email || '').toLowerCase();
      if (lower.includes('pro') || lower.includes('paid') || lower.endsWith('.go.kr') || lower.endsWith('.ac.kr') || lower.endsWith('.edu')) {
        return 'paid';
      }
      return 'free';
    }

    function completeGoogleLoginAuto() {
      const emailInput = document.getElementById('login-email-input');
      const email = emailInput?.value.trim();
      if (!email || !email.includes('@')) {
        showToast('올바른 Google 이메일 주소를 입력해 주세요.', 'warning');
        emailInput?.focus();
        return;
      }
      const derivedName = email.split('@')[0];
      const detectedTier = detectAccountTierByEmail(email);
      state.auth.isLoggedIn = true;
      state.auth.user = { name: derivedName, email };
      state.quota.tier = detectedTier;
      saveAuthState();
      saveQuotaState();
      loadUserGamePrefs();
      closeModal();
      render();
      showToast(`${email} 로그인 완료 (저장된 개인 설정 및 한도가 자동 적용되었습니다)`, 'success');
    }

    function logoutGoogleAccount() {
      state.auth.isLoggedIn = false;
      state.auth.user = null;
      saveAuthState();
      loadUserGamePrefs();
      closeModal();
      render();
      showToast('Google 계정에서 로그아웃되었습니다.', 'info');
    }

    function getQuotaStats() {
      const limit = state.quota.tier === 'paid' ? state.quota.paidDailyLimit : state.quota.freeDailyLimit;
      const used = Math.min(state.quota.usedToday, limit);
      const remaining = Math.max(0, limit - used);
      const pctRemaining = Math.round((remaining / limit) * 100);
      return { limit, used, remaining, pctRemaining };
    }

    function consumeAiQuota(count, description) {
      const stats = getQuotaStats();
      if (stats.remaining <= 0) {
        showToast('오늘의 Gemini AI 기본 사용량을 모두 소진했습니다.', 'error');
        openModal('quota');
        return false;
      }
      state.quota.usedToday += 1;
      state.quota.history.unshift({
        time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }),
        desc: description,
        count
      });
      if (state.quota.history.length > 20) state.quota.history.pop();
      saveQuotaState();
      renderAuthQuotaBar();
      return true;
    }

    function renderAuthQuotaBar() {
      const bar = document.getElementById('auth-quota-bar');
      if (!bar) return;

      if (!state.auth.isLoggedIn) {
        bar.innerHTML = `
          <button onclick="openModal('login')" class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-white hover:bg-slate-50 text-slate-800 border border-slate-300 shadow-sm text-xs sm:text-sm font-extrabold transition">
            <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96z"/></svg>
            <span>Google 로그인</span>
          </button>
        `;
        return;
      }

      const stats = getQuotaStats();
      const barColor = stats.pctRemaining > 50 ? 'bg-emerald-500' : stats.pctRemaining > 20 ? 'bg-amber-500' : 'bg-rose-500';
      const tierBadge = state.quota.tier === 'paid'
        ? '<span class="px-1.5 py-0.5 rounded bg-amber-100 text-amber-800 text-[10px] font-black">PRO</span>'
        : '<span class="px-1.5 py-0.5 rounded bg-blue-100 text-blue-800 text-[10px] font-black">FREE</span>';

      bar.innerHTML = `
        <!-- Gemini 사용량 게이지 (클릭 시 상세 보기) -->
        <button onclick="openModal('quota')" title="클릭하여 Gemini AI 사용량 상세 내역 확인" class="flex items-center gap-2.5 px-3 py-1.5 rounded-xl bg-slate-50 hover:bg-slate-100 border border-slate-200 transition text-left">
          <div>
            <div class="flex items-center gap-1.5 text-[11px] font-extrabold text-slate-700">
              <span>Gemini 잔여</span>
              ${tierBadge}
              <span class="text-slate-900">${stats.remaining}/${stats.limit}회</span>
            </div>
            <div class="w-28 sm:w-32 h-2 bg-slate-200 rounded-full overflow-hidden mt-1">
              <div class="h-full ${barColor} transition-all duration-500" style="width: ${stats.pctRemaining}%"></div>
            </div>
          </div>
        </button>

        <!-- 로그인 계정 버튼 -->
        <button onclick="openModal('login')" class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-900 text-xs font-extrabold transition">
          <span class="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-black uppercase">
            ${escapeHtml((state.auth.user?.email || 'G')[0])}
          </span>
          <span class="hidden sm:inline max-w-[130px] truncate">${escapeHtml(state.auth.user?.email || '')}</span>
        </button>
      `;
    }

    function requestSaveToGoogleDrive(quizId) {
      if (!state.auth.isLoggedIn) {
        showToast('Google Drive 저장을 위해 먼저 Google 로그인을 해주세요.', 'warning');
        openModal('login');
        return;
      }
      state.driveBrowser.pendingQuizId = quizId;
      state.driveBrowser.mode = 'save';
      openModal('drive_picker');
    }

    function requestLoadFromGoogleDrive() {
      if (!state.auth.isLoggedIn) {
        showToast('Google Drive 불러오기를 위해 먼저 Google 로그인을 해주세요.', 'warning');
        openModal('login');
        return;
      }
      state.driveBrowser.mode = 'load';
      openModal('drive_picker');
    }

    function createNewDriveFolderOption() {
      const input = document.getElementById('new-drive-folder-input');
      const raw = input?.value.trim();
      if (!raw) return;
      const fullPath = raw.startsWith('내 드라이브') ? raw : `내 드라이브 / ${raw}`;
      if (!state.driveBrowser.folders.includes(fullPath)) {
        state.driveBrowser.folders.push(fullPath);
        saveDriveFolders();
      }
      state.driveBrowser.selectedFolder = fullPath;
      renderModal();
      showToast(`'${fullPath}' 폴더가 생성되었습니다.`, 'success');
    }

    function confirmSaveToSelectedDriveFolder() {
      const quizId = state.driveBrowser.pendingQuizId;
      const folder = state.driveBrowser.selectedFolder;
      const quizObj = state.quizzes.find(q => q.id === quizId);
      if (!quizObj) return;

      quizObj.syncedDrive = true;
      quizObj.driveFolder = folder;
      saveQuizzes();

      const key = 'mq_gdrive_cloud_' + (state.auth.user?.email || 'default');
      const existing = JSON.parse(localStorage.getItem(key) || '[]');
      const idx = existing.findIndex(item => item.id === quizObj.id);
      if (idx >= 0) existing[idx] = quizObj;
      else existing.unshift(quizObj);
      localStorage.setItem(key, JSON.stringify(existing));

      closeModal();
      render();
      showToast(`[${folder}] 위치에 저장되었습니다!`, 'success');
    }

    function importSingleDriveQuiz(quizId) {
      const key = 'mq_gdrive_cloud_' + (state.auth.user?.email || 'default');
      const cloudList = JSON.parse(localStorage.getItem(key) || '[]');
      const target = cloudList.find(q => q.id === quizId);
      if (!target) return;

      const existIdx = state.quizzes.findIndex(q => q.id === target.id);
      if (existIdx >= 0) state.quizzes[existIdx] = target;
      else state.quizzes.unshift(target);

      state.selectedQuizId = target.id;
      saveQuizzes();
      closeModal();
      render();
      showToast(`'${target.title}' 퀴즈를 불러왔습니다!`, 'success');
    }

          explanation: '신호가 바뀐 직후에도 멈추지 않는 차량이 있을 수 있으므로 좌우 확인 후 건너야 안전합니다.'
        },
        {
          cat: '예술·음악', maxGrade: 6, type: '4CHOICE',
          question: `${topicPrefix}다음 악기 중 활로 줄을 문질러 소리를 내는 현악기는 무엇인가요?`,
          options: ['플루트', '트럼펫', '바이올린', '실로폰'], answerIndex: 2,
          explanation: '바이올린은 활로 현을 문질러 소리를 내는 대표적인 찰현악기입니다.'
        }
      ];

      // 선택한 최고 학년보다 높은 학년 문제 제외 및 선택 카테고리 필터링
      let filtered = bank.filter(item => {
        const gradeOk = maxSelectedGrade >= 9 ? true : item.maxGrade <= Math.max(maxSelectedGrade, 3);
        const catOk = categories.includes(item.cat);
        return gradeOk && catOk;
      });
      if (!filtered.length) filtered = bank;
      return filtered;
    }

    function validateAiCommonSettings() {
      const c = state.creator;
      if (!c.selectedFormats.length) {
        showToast('상위 설정에서 문제 유형(OX 퀴즈 또는 4지선다)을 1개 이상 선택해 주세요.', 'warning');
        return false;
      }
      return true;
    }

    function runTopicAiQuizGeneration() {
      if (!state.auth.isLoggedIn) {
        showToast('AI 퀴즈 만들기를 위해 먼저 우측 상단에서 Google 로그인을 해주세요.', 'warning');
        openModal('login');
        return;
      }
      if (!validateAiCommonSettings()) return;

      const c = state.creator;
      if (!c.selectedGrades.length) {
        showToast('대상 학년을 1개 이상 선택해 주세요. (중복 선택 가능)', 'warning');
        return;
      }
      if (!c.selectedCategories.length) {
        showToast('분야 또는 교과목을 1개 이상 선택해 주세요. (중복 선택 가능)', 'warning');
        return;
      }

      const count = Math.min(50, Math.max(1, Number(c.questionCount) || 5));
      const gradeSummary = c.selectedGrades.join('·');
      const label = c.customTopic.trim() || `${gradeSummary} ${c.mixAllCategories ? '전 영역 혼합' : c.selectedCategories.join('·')} 퀴즈`;
      if (!consumeAiQuota(count, label)) return;

      const pool = generateGradeCurriculumBank(c.selectedGrades, c.selectedCategories, c.customTopic.trim());
      const allowOx = c.selectedFormats.includes('OX');
      const allow4 = c.selectedFormats.includes('4CHOICE');

      const generated = [];
      for (let i = 0; i < count; i++) {
        const base = pool[i % pool.length];
        let item = JSON.parse(JSON.stringify(base));
        const wantOx = allowOx && allow4 ? (i % 2 === 0) : allowOx;

        if (wantOx && item.type !== 'OX') {
          item = {
            type: 'OX',
            question: `[${item.cat}] ${item.question.replace(/\?$/, '')}의 정답은 '${item.options[item.answerIndex]}'이다.`,
            options: ['O (그렇다)', 'X (아니다)'],
            answerIndex: 0,
            explanation: item.explanation
          };
        } else if (!wantOx && item.type !== '4CHOICE') {
          item = {
            type: '4CHOICE',
            question: `[${item.cat}] 다음 설명에 대해 가장 알맞은 것을 고르세요: "${item.question}"`,
            options: ['맞는 설명이다 (O)', '틀린 설명이다 (X)', '조건에 따라 다르다', '알 수 없다'],
            answerIndex: 0,
            explanation: item.explanation
          };
        }
        item.id = 'gen_' + Date.now() + '_' + i;
        item.stage = 'main';
        generated.push(item);
      }

      state.creator.editingQuizId = null;
      state.creator.title = label;
      state.creator.draftQuestions = generated;
      render();
      setTimeout(() => {
        document.getElementById('draft-questions-section')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 60);
      showToast(`Gemini AI가 ${gradeSummary} 맞춤 퀴즈 ${generated.length}문항을 생성했습니다! 아래에서 바로 확인·수정하세요.`, 'success');
    }

    function handleMaterialFileSelect(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      state.creator.materialFileName = file.name;

      const reader = new FileReader();
      reader.onload = function (ev) {
        const raw = String(ev.target?.result || '');
        const cleanText = raw.replace(/[^\uAC00-\uD7A3a-zA-Z0-9\s.,?!()%~-]/g, ' ').replace(/\s+/g, ' ').trim();
        state.creator.materialText = cleanText.length > 30
          ? cleanText.slice(0, 3000)
          : `[첨부 문서: ${file.name}] 본 자료의 핵심 개념과 주요 내용을 바탕으로 출제된 학습 확인 문항입니다.`;
        render();
        showToast(`'${file.name}' 자료가 첨부되었습니다.`, 'success');
      };
      reader.readAsText(file, 'utf-8');
    }

    function runMaterialAiQuizGeneration() {
      if (!state.auth.isLoggedIn) {
        showToast('AI 퀴즈 만들기를 위해 먼저 우측 상단에서 Google 로그인을 해주세요.', 'warning');
        openModal('login');
        return;
      }
      if (!validateAiCommonSettings()) return;

      const c = state.creator;
      if (!c.materialFileName && !c.materialText.trim()) {
        showToast('먼저 PDF, 이미지, 한글, 워드, PPT 파일을 첨부하거나 핵심 내용을 입력해 주세요.', 'warning');
        return;
      }

      const count = Math.min(50, Math.max(1, Number(c.questionCount) || 5));
      const sourceName = c.materialFileName || '직접 입력 기초 자료';
      if (!consumeAiQuota(count, `자료 출제: ${sourceName}`)) return;

      const sentences = (c.materialText || sourceName)
        .split(/[.!?\n]/)
        .map(s => s.trim())
        .filter(s => s.length >= 6);

      const allowOx = c.selectedFormats.includes('OX');
      const allow4 = c.selectedFormats.includes('4CHOICE');

      const generated = [];
      for (let i = 0; i < count; i++) {
        const snippet = sentences[i % Math.max(1, sentences.length)] || `${sourceName}의 핵심 학습 내용`;
        const useOx = allowOx && allow4 ? (i % 2 === 0) : allowOx;
        if (useOx) {
          generated.push({
            id: 'mat_' + Date.now() + '_' + i,
            stage: 'main',
            type: 'OX',
            question: `[자료 기반] "${snippet.slice(0, 65)}" 내용은 첨부된 자료의 설명과 일치한다.`,
            options: ['O (그렇다)', 'X (아니다)'],
            answerIndex: 0,
            explanation: `첨부 자료(${sourceName}) 본문에서 확인된 사실입니다.`
          });
        } else {
          generated.push({
            id: 'mat_' + Date.now() + '_' + i,
            stage: 'main',
            type: '4CHOICE',
            question: `[자료 기반] 다음 중 '${sourceName}' 자료에서 다룬 핵심 내용으로 옳은 것은?`,
            options: [
              snippet.slice(0, 48),
              '자료에 언급되지 않은 반대 개념이다',
              '전혀 다른 단원의 내용이다',
              '해당 사항이 전혀 없다'
            ],
            answerIndex: 0,
            explanation: `첨부 자료(${sourceName}) 근거 문장: ${snippet.slice(0, 60)}`
          });
        }
      }

      state.creator.editingQuizId = null;
      state.creator.title = `${sourceName} 기반 퀴즈`;
      state.creator.draftQuestions = generated;
      render();
      setTimeout(() => {
        document.getElementById('draft-questions-section')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 60);
      showToast(`첨부 자료 기반으로 ${generated.length}문항이 생성되었습니다! 아래에서 바로 확인·수정하세요.`, 'success');
    }

    // 엑셀 양식 다운로드 / 업로드
    function downloadExcelTemplate() {
      const rows = [
        ['문제유형(OX 또는 4지선다)', '질문내용', '보기1', '보기2', '보기3(OX는 비움)', '보기4(OX는 비움)', '정답번호(1~4)', '해설'],
        ['OX', '지구는 태양 주위를 1년에 한 바퀴 공전한다.', 'O (그렇다)', 'X (아니다)', '', '', 1, '지구의 공전 주기는 약 365일(1년)입니다.'],
        ['4지선다', '다음 중 우리나라의 수도는 어디인가요?', '부산', '서울', '대전', '광주', 2, '대한민국의 수도는 서울특별시입니다.']
      ];
      const ws = XLSX.utils.aoa_to_sheet(rows);

    function exportQuestionsToExcel(title, questions) {
      if (!questions || !questions.length) {
        showToast('다운로드할 문제가 없습니다.', 'warning');
        return;
      }
      const rows = [
        ['문제유형(OX 또는 4지선다)', '질문내용', '보기1', '보기2', '보기3', '보기4', '정답번호(1~4)', '해설']
      ];
      questions.forEach(q => {
        rows.push([
          q.type === 'OX' ? 'OX' : '4지선다',
          q.question,
          q.options[0] || '',
          q.options[1] || '',
          q.options[2] || '',
          q.options[3] || '',
          (Number(q.answerIndex) || 0) + 1,
          q.explanation || ''
        ]);
      });
      const ws = XLSX.utils.aoa_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '퀴즈목록');
      XLSX.writeFile(wb, `${title || '무브앤퀴즈'}.xlsx`);
      showToast('퀴즈가 엑셀 파일(.xlsx)로 다운로드되었습니다!', 'success');
    }

    function handleExcelUpload(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (ev) {
        try {
          const data = new Uint8Array(ev.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
          const parsed = [];

          for (let i = 1; i < rows.length; i++) {
            const r = rows[i];
            if (!r || !r[1]) continue;
            const rawType = String(r[0] || '').trim().toUpperCase();
            const isOx = rawType.includes('OX');
            const options = isOx
              ? [String(r[2] || 'O (그렇다)'), String(r[3] || 'X (아니다)')]
              : [String(r[2] || '보기 1'), String(r[3] || '보기 2'), String(r[4] || '보기 3'), String(r[5] || '보기 4')];
            const ansIdx = Math.max(0, Math.min(options.length - 1, (parseInt(r[6], 10) || 1) - 1));
            parsed.push({
              id: 'xl_' + Date.now() + '_' + i,
              stage: 'main',
              type: isOx ? 'OX' : '4CHOICE',
              question: String(r[1]).trim(),
              options,
              answerIndex: ansIdx,
              explanation: String(r[7] || '').trim()
            });
          }

          if (!parsed.length) {
            showToast('엑셀 파일에서 유효한 문항을 찾지 못했습니다.', 'error');
            return;
          }
          state.creator.editingQuizId = null;
          state.creator.title = file.name.replace(/\.[^/.]+$/, '');
          state.creator.draftQuestions = parsed;
          render();
          showToast(`엑셀에서 ${parsed.length}문항을 성공적으로 불러왔습니다!`, 'success');
        } catch (err) {
          showToast('엑셀 파일을 읽는 중 오류가 발생했습니다.', 'error');
        }
      };
      reader.readAsArrayBuffer(file);
    }

    // 웹에서 즉시 문항 수정, 중간 삽입, 패자부활전 지정 및 보관함/Drive 저장
    function updateDraftQuestionField(index, field, value) {
      const q = state.creator.draftQuestions[index];
      if (!q) return;
      if (field === 'question') q.question = value;
      else if (field === 'explanation') q.explanation = value;
      else if (field === 'stage') {
        q.stage = value;
        render();
      } else if (field === 'answerIndex') {
        q.answerIndex = Number(value);
        render();
      } else if (field.startsWith('option_')) {
        const optIdx = Number(field.split('_')[1]);
        q.options[optIdx] = value;
      }
    }

    function removeDraftQuestion(index) {
      state.creator.draftQuestions.splice(index, 1);
      render();
    }

    function insertDraftQuestionAt(insertIndex, type, stage = 'main') {
      const isRevival = stage === 'revival';
      const newItem = {
        id: 'manual_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        stage,
        type,
        question: isRevival ? '[패자부활전] 탈락한 친구들이 다시 도전할 수 있는 문제를 입력하세요.' : '새 문제를 여기에 입력하세요.',
        options: type === 'OX' ? ['O (그렇다)', 'X (아니다)'] : ['보기 1', '보기 2', '보기 3', '보기 4'],
        answerIndex: 0,
        explanation: ''
      };
      const targetIdx = Math.max(0, Math.min(state.creator.draftQuestions.length, insertIndex));
      state.creator.draftQuestions.splice(targetIdx, 0, newItem);
      render();
      showToast(`${targetIdx + 1}번 위치에 ${isRevival ? '패자부활전' : '본 문제'} 문항이 추가되었습니다.`, 'info');
    }

    function addEmptyDraftQuestion(type, stage = 'main') {
      insertDraftQuestionAt(state.creator.draftQuestions.length, type, stage);
    }

    function editExistingQuizInCreator(quizId) {
      const target = state.quizzes.find(q => q.id === quizId);
      if (!target) return;
      state.creator.mainMode = 'manual';
      state.creator.editingQuizId = target.id;
      state.creator.title = target.title;
      state.creator.draftQuestions = JSON.parse(JSON.stringify(target.questions)).map(q => ({
        stage: 'main',
        ...q
      }));
      navigate('creator');
      setTimeout(() => {
        document.getElementById('draft-questions-section')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 60);
    }

    function saveDraftQuizToLibrary(alsoOpenDrive = false) {
      if (!state.creator.draftQuestions.length) {
        showToast('저장할 문제가 없습니다.', 'warning');
        return;
      }
      const existingIdx = state.creator.editingQuizId
        ? state.quizzes.findIndex(q => q.id === state.creator.editingQuizId)
        : -1;

      const savedQuiz = {
        id: existingIdx >= 0 ? state.quizzes[existingIdx].id : ('quiz_' + Date.now()),
        title: state.creator.title.trim() || '새 맞춤 퀴즈',
        grade: state.creator.selectedGrades.join('·') || '전학년',
        categories: [...state.creator.selectedCategories],
        updatedAt: new Date().toLocaleDateString('ko-KR'),
        syncedDrive: existingIdx >= 0 ? state.quizzes[existingIdx].syncedDrive : false,
        driveFolder: existingIdx >= 0 ? state.quizzes[existingIdx].driveFolder : state.driveBrowser.selectedFolder,
        questions: JSON.parse(JSON.stringify(state.creator.draftQuestions))
      };

      if (existingIdx >= 0) {
        state.quizzes[existingIdx] = savedQuiz;
      } else {
        state.quizzes.unshift(savedQuiz);
      }
      state.creator.editingQuizId = null;
      state.selectedQuizId = savedQuiz.id;
      saveQuizzes();

      if (alsoOpenDrive) {
        requestSaveToGoogleDrive(savedQuiz.id);
      } else {
        navigate('library');
        showToast(`'${savedQuiz.title}' 퀴즈가 보관함에 저장되었습니다!`, 'success');
      }
    }

                    <button onclick="exportQuestionsToExcel(state.creator.title, state.creator.draftQuestions)" class="h-11 px-4 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-xs font-extrabold flex items-center justify-center whitespace-nowrap">⬇ 엑셀 내보내기</button>

                    <button onclick="saveDraftQuizToLibrary(true)" class="h-11 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold flex items-center justify-center whitespace-nowrap">☁ Google Drive에 저장</button>
                  </div>
                </div>
              </div>

              <div class="space-y-3">

                        <div class="flex flex-wrap items-center gap-2">
                          <span class="px-2.5 py-1 rounded-lg ${isRevival ? 'bg-rose-600 text-white' : 'bg-blue-100 text-blue-800'} text-xs font-black">

                            <button onclick="updateDraftQuestionField(${idx}, 'stage', 'revival')" class="px-2.5 py-1 rounded-lg text-[11px] font-extrabold transition ${isRevival ? 'bg-rose-600 text-white' : 'text-slate-600 hover:bg-rose-50'}">🔥 패자부활전</button>
                          </div>
                        </div>
                        <button onclick="removeDraftQuestion(${idx})" class="px-2.5 py-1 rounded-lg bg-white hover:bg-rose-50 border border-rose-200 text-xs font-extrabold text-rose-600">삭제</button>

                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        ${q.options.map((opt, oIdx) => `

                      <input type="text" value="${escapeHtml(q.explanation || '')}" oninput="updateDraftQuestionField(${idx}, 'explanation', this.value)" placeholder="해설 입력 (선택)" class="w-full px-3 py-1.5 rounded-xl border border-slate-200 bg-white text-xs text-slate-600" />

      `;
    }

    function renderSettingsScreen() {

            </div>
            <button onclick="Object.assign(state.game, JSON.parse(JSON.stringify(DEFAULT_USER_PREFS))); saveUserGamePrefs(); render(); if(state.settingsTab==='camera') initSettingsCameraPreview(); showToast('기본 설정으로 초기화되었습니다.', 'info');" class="h-10 px-4 rounded-xl bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 text-xs font-extrabold">

            <button onclick="switchSettingsTab('rules')" class="h-11 px-3 rounded-xl text-xs sm:text-sm font-black transition flex items-center justify-center gap-1.5 ${tab === 'rules' ? 'bg-blue-600 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}">

              <div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                      </div>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          ` : tab === 'rules' ? `

                  <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                    ${[
                      { val: 1, label: '최후의 1인', sub: '골든벨 방식' },
                      { val: 2, label: '최후의 2명', sub: 'TOP 2 결승' },
                      { val: 3, label: '최후의 3명', sub: 'TOP 3 시상' },
                      { val: 5, label: '최후의 5명', sub: 'TOP 5 선발' },

                  <div class="space-y-1 pt-2 border-t border-slate-100">
                    <div class="flex justify-between text-xs font-extrabold">
                      <span>정답 확인 및 탈락자 이동 시간</span>

                    <input type="range" min="3" max="30" step="1" value="${g.revealMoveTimeSec}" oninput="updateGamePref('revealMoveTimeSec', Number(this.value))" class="w-full" />

                    <span class="text-xs font-black text-slate-800">다음 문제 넘김</span>
                    <div class="inline-flex rounded-xl bg-slate-100 p-0.5 border border-slate-200">
                      <button onclick="updateGamePref('autoAdvance', false)" class="h-8 px-3 rounded-lg text-xs font-extrabold ${!g.autoAdvance ? 'bg-slate-900 text-white' : 'text-slate-600'}">수동 넘김</button>
                      <button onclick="updateGamePref('autoAdvance', true)" class="h-8 px-3 rounded-lg text-xs font-extrabold ${g.autoAdvance ? 'bg-blue-600 text-white' : 'text-slate-600'}">자동 넘김</button>
                    </div>
                  </div>
                  <div class="flex items-center justify-between pt-2 border-t border-slate-100">
                    <span class="text-xs font-black text-slate-800">패자부활전 문항 실행</span>

                    { id: 'void_round', num: '②', title: '탈락 무효', desc: '이번 문제 결과를 무효로 하고 직전 생존 인원 그대로 진행합니다.', msgKey: 'allEliminatedMsgVoid' },
                    { id: 'end_game', num: '③', title: '즉시 게임 종료', desc: '전원 탈락 안내를 띄우고 현재 라운드에서 퀴즈를 종료합니다.', msgKey: 'allEliminatedMsgEnd' }

                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>

          ` : `

                  <div class="flex items-center gap-1.5">
                    <button onclick="state.settingsPreviewMode='OX'; render(); initSettingsCameraPreview();" class="h-8 px-3 rounded-xl text-xs font-extrabold border ${state.settingsPreviewMode === 'OX' ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-100 text-slate-700 border-slate-200'}">OX 구역</button>

                  <video id="settings-preview-video" playsinline muted class="hidden"></video>

                  <!-- 설정 화면에서도 위치 및 투명도를 즉시 조정해볼 수 있는 교사 조작 리모컨 미리보기 -->
                  <div
                    id="settings-hud-preview"
                    style="${(g.hudX !== null && g.hudY !== null) ? `left:${Math.min(260, g.hudX)}px; top:${Math.min(180, g.hudY)}px;` : 'right:12px; top:12px;'} opacity:${g.hudOpacity};"
                    class="absolute z-20 w-[235px] rounded-2xl bg-slate-950/90 backdrop-blur-md border border-white/25 text-white shadow-xl p-2.5 space-y-2"
                  >
                    <div id="settings-hud-drag-handle" class="cursor-move flex items-center justify-between gap-1 pb-1.5 border-b border-white/15">
                      <span class="text-[10px] font-black text-amber-300">⠿ 교사 조작 리모컨 (드래그)</span>
                      <span id="settings-hud-opacity-text" class="text-[10px] font-bold text-slate-300">${Math.round(g.hudOpacity * 100)}%</span>
                    </div>
                    <div class="grid grid-cols-2 gap-1 text-[10px] font-extrabold">
                      <div class="h-7 rounded-lg bg-blue-600 flex items-center justify-center">▶ 문제 제시</div>
                      <div class="h-7 rounded-lg bg-slate-800 flex items-center justify-center">⏸ 일시정지</div>
                      <div class="h-7 rounded-lg bg-emerald-600 flex items-center justify-center">✓ 정답 공개</div>
                      <div class="h-7 rounded-lg bg-indigo-600 flex items-center justify-center">다음 문제 →</div>
                    </div>
                  </div>

                  <div class="absolute bottom-2.5 left-2.5 right-2.5 flex items-center justify-between pointer-events-none">
                    <span class="px-2.5 py-1 rounded-lg bg-slate-950/75 text-white text-[10px] font-bold">
                      ${g.cameraActive ? '실제 카메라 인물 머리 위 뱃지 실시간 인식 중' : '가상 학생 드래그로 구역·경계선(주황)·이탈(깜빡임) 확인'}
                    </span>
                    <span class="px-2.5 py-1 rounded-lg bg-slate-950/75 text-amber-300 text-[10px] font-bold">
                      ${g.cameraActive ? '● 웹캠 LIVE' : '● 시뮬레이터'}
                    </span>
                  </div>
                </div>
              </div>

              <!-- 우측: 카메라·경계선·배치 세부 조절 -->
              <div class="lg:col-span-5 rounded-3xl p-5 border shadow-sm space-y-4 ${activeTheme.panelClass}">
                <div class="text-sm font-black text-emerald-600">구역 배치 및 경계선 세부 조정</div>

                <div class="space-y-1.5">
                  <div class="text-xs font-black">4지선다 구역 분할 방식</div>
                  <div class="grid grid-cols-2 gap-2">
                    <button onclick="updateGamePref('choice4Layout', 'horizontal', false); state.settingsPreviewMode='4CHOICE'; render(); initSettingsCameraPreview();" class="p-2.5 rounded-xl border-2 text-left transition ${g.choice4Layout === 'horizontal' ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50 text-slate-800 border-slate-200'}">
                      <div class="text-xs font-black">가로 4구역 (1×4)</div>
                      <div class="text-[10px] opacity-85">좌에서 우로 1·2·3·4번</div>
                    </button>
                    <button onclick="updateGamePref('choice4Layout', 'grid2x2', false); state.settingsPreviewMode='4CHOICE'; render(); initSettingsCameraPreview();" class="p-2.5 rounded-xl border-2 text-left transition ${g.choice4Layout === 'grid2x2' ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50 text-slate-800 border-slate-200'}">
                      <div class="text-xs font-black">사분면 배치 (2×2)</div>
                      <div class="text-[10px] opacity-85">상하좌우 4칸 구역</div>
                    </button>
                  </div>
                </div>

                <div class="space-y-1 pt-2 border-t border-slate-200/70">
                  <div class="flex justify-between text-xs font-extrabold">
                    <span>정답 구역 경계선 두께 (실시간 반영)</span>
                    <span class="text-blue-600">${Math.round(g.boundaryWidthRatio * 1000) / 10}%</span>
                  </div>
                  <input type="range" min="0.015" max="0.08" step="0.005" value="${g.boundaryWidthRatio}" oninput="updateGamePref('boundaryWidthRatio', Number(this.value), false); document.getElementById('bound-val-label').textContent=(Math.round(Number(this.value)*1000)/10)+'%';" class="w-full" />
                  <div class="text-[11px] opacity-75">현재 경계선 폭: <strong id="bound-val-label">${Math.round(g.boundaryWidthRatio * 1000) / 10}%</strong></div>
                </div>

                <div class="space-y-1 pt-2 border-t border-slate-200/70">
                  <div class="flex justify-between text-xs font-extrabold">
                    <span>머리 위 공중 뱃지 띄움 높이</span>
                    <span class="text-blue-600">${g.headBadgeOffsetPx}px</span>
                  </div>
                  <input type="range" min="20" max="80" step="2" value="${g.headBadgeOffsetPx}" oninput="updateGamePref('headBadgeOffsetPx', Number(this.value), false)" class="w-full" />
                </div>

                <div class="flex items-center justify-between pt-2 border-t border-slate-200/70">
                  <span class="text-xs font-black">카메라 좌우 반전 (거울 모드)</span>
                  <button onclick="updateGamePref('mirrorCamera', !state.game.mirrorCamera, false); render(); initSettingsCameraPreview();" class="h-8 px-3.5 rounded-xl text-xs font-extrabold ${g.mirrorCamera ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-700'}">
                    ${g.mirrorCamera ? '켜짐' : '꺼짐'}
                  </button>
                </div>

                <div class="flex items-center justify-between pt-2 border-t border-slate-200/70">
                  <span class="text-xs font-black">카운트·정답 효과음</span>
                  <button onclick="updateGamePref('soundEnabled', !state.game.soundEnabled)" class="h-8 px-3.5 rounded-xl text-xs font-extrabold ${g.soundEnabled ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-700'}">
                    ${g.soundEnabled ? '켜짐' : '음소거'}
                  </button>
                </div>

                <div class="space-y-1 pt-2 border-t border-slate-200/70">
                  <div class="flex justify-between text-xs font-extrabold">
                    <span>교사 조작 리모컨(HUD) 기본 투명도 (좌측 미리보기 즉시 반영)</span>
                    <span id="settings-hud-opacity-val" class="text-blue-600">${Math.round(g.hudOpacity * 100)}%</span>
                  </div>
                  <input type="range" min="0.25" max="1" step="0.05" value="${g.hudOpacity}" oninput="const v=Number(this.value); updateGamePref('hudOpacity', v, false); document.getElementById('settings-hud-opacity-val').textContent=Math.round(v*100)+'%'; const t=document.getElementById('settings-hud-opacity-text'); if(t) t.textContent=Math.round(v*100)+'%'; const h=document.getElementById('settings-hud-preview'); if(h) h.style.opacity=v;" class="w-full" />
                </div>
              </div>
            </div>
          `}
        </div>
      `;
    }

    function playToneBeep(freq = 880, duration = 0.12, type = 'sine') {
      if (!state.game.soundEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.16, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function getActivePlayableQuestions(quiz) {
      const all = quiz.questions || [];
      if (state.game.enableRevival) return all;
      const mainOnly = all.filter(q => q.stage !== 'revival');
      return mainOnly.length ? mainOnly : all;
    }

    function presentCurrentQuestion() {
      const quiz = state.quizzes.find(q => q.id === state.selectedQuizId) || state.quizzes[0];
      const questions = getActivePlayableQuestions(quiz);
      const q = questions[state.game.questionIndex] || questions[0];

      if (state.game.revivalTimeout) {
        clearTimeout(state.game.revivalTimeout);
        state.game.revivalTimeout = null;
      }

      state.game.paused = false;
      state.game.timeLeft = state.game.solveTimeSec;
      state.game.revealTimeLeft = state.game.revealMoveTimeSec;

      if (q && q.stage === 'revival') {
        state.game.participants.forEach(p => { p.eliminated = false; });
        state.game.phase = 'revival_intro';
        state.game.specialBannerText = '🔥 패자부활전 🔥';
        state.game.specialBannerSub = '탈락한 친구들도 모두 구역 안으로 입장하세요!';
        playToneBeep(523.25, 0.15, 'triangle');
        setTimeout(() => playToneBeep(783.99, 0.25, 'triangle'), 160);
        render();
        initCameraAndGameLoop();
        state.game.revivalTimeout = setTimeout(() => {
          if (state.route === 'play' && state.game.phase === 'revival_intro') {
            state.game.phase = 'answering';
            render();
            initCameraAndGameLoop();
          }
        }, 2800);
      } else {
        state.game.phase = 'answering';
        playToneBeep(660, 0.12, 'sine');
        render();
        initCameraAndGameLoop();
      }
    }

    function revealCurrentAnswer() {
      const quiz = state.quizzes.find(q => q.id === state.selectedQuizId) || state.quizzes[0];
      const questions = getActivePlayableQuestions(quiz);
      const q = questions[state.game.questionIndex] || questions[0];

      const activePlayers = state.game.participants.filter(p => !p.eliminated);
      const survivorsThisRound = activePlayers.filter(p => p.status === 'selected' && p.choiceIndex === q.answerIndex);

      // 전원 탈락 발생 시 설정된 규칙 처리
      if (activePlayers.length > 0 && survivorsThisRound.length === 0) {
        const rule = state.game.allEliminatedRule;
        if (rule === 'revive_all') {
          state.game.participants.forEach(p => { p.eliminated = false; });
          state.game.specialBannerText = '전원 부활!';
          state.game.specialBannerSub = state.game.allEliminatedMsgRevive;
          state.game.phase = 'all_eliminated_alert';
          playToneBeep(523.25, 0.15, 'triangle');
          render();
          initCameraAndGameLoop();
          return;
        } else if (rule === 'void_round') {
          state.game.specialBannerText = '이번 문제 무효!';
          state.game.specialBannerSub = state.game.allEliminatedMsgVoid;
          state.game.phase = 'all_eliminated_alert';
          playToneBeep(440, 0.2, 'sine');
          render();
          initCameraAndGameLoop();
          return;
        } else if (rule === 'end_game') {
          activePlayers.forEach(p => { p.eliminated = true; });
          state.game.specialBannerText = '전원 탈락 · 게임 종료';
          state.game.specialBannerSub = state.game.allEliminatedMsgEnd;
          state.game.phase = 'finished';
          playToneBeep(330, 0.3, 'sawtooth');
          render();
          initCameraAndGameLoop();
          return;
        }
      }

      // 일반 탈락 처리
      activePlayers.forEach(p => {
        if (p.status !== 'selected' || p.choiceIndex !== q.answerIndex) {
          p.eliminated = true;
        }
      });

      const remainingCount = state.game.participants.filter(p => !p.eliminated).length;
      const target = Number(state.game.targetSurvivors);
      if (target > 0 && remainingCount > 0 && remainingCount <= target) {
        state.game.specialBannerText = `🏆 최종 생존 ${remainingCount}명 달성!`;
        state.game.specialBannerSub = `목표 인원(${target}명 이하)에 도달하여 우승자가 결정되었습니다!`;
        state.game.phase = 'finished';
        playToneBeep(880, 0.25, 'triangle');
        render();
        initCameraAndGameLoop();
        return;
      }

      state.game.phase = 'revealed';
      state.game.paused = false;
      state.game.revealTimeLeft = state.game.revealMoveTimeSec;
      playToneBeep(880, 0.18, 'triangle');
      render();
      initCameraAndGameLoop();
    }

    function goToNextQuestion() {
      const quiz = state.quizzes.find(q => q.id === state.selectedQuizId) || state.quizzes[0];
      const questions = getActivePlayableQuestions(quiz);
      if (state.game.questionIndex < questions.length - 1) {
        state.game.questionIndex += 1;
        presentCurrentQuestion();
      } else {
        const remainingCount = state.game.participants.filter(p => !p.eliminated).length;
        state.game.specialBannerText = '🎉 모든 문항 완주 완료!';
        state.game.specialBannerSub = `최종 생존 인원: ${remainingCount}명`;
        state.game.phase = 'finished';
        state.game.paused = true;
        render();
        initCameraAndGameLoop();
      }
    }

    function togglePauseGame() {
      state.game.paused = !state.game.paused;
      render();
      initCameraAndGameLoop();
    }

    function renderPlayScreen() {
      const quiz = state.quizzes.find(q => q.id === state.selectedQuizId) || state.quizzes[0];
      const questions = getActivePlayableQuestions(quiz);
      const q = questions[state.game.questionIndex] || questions[0];
      const phase = state.game.phase;
      const isRevealed = phase === 'revealed' || phase === 'finished';
      const isRevival = q.stage === 'revival';
      const g = state.game;
      const theme = THEME_CONFIGS[g.theme] || THEME_CONFIGS.classic;
      const aliveCount = g.participants.filter(p => !p.eliminated).length;
      const isTeacherMonitor = !isStudentDisplayMode;

      const hudStyle = (g.hudX !== null && g.hudY !== null)
        ? `left: ${g.hudX}px; top: ${g.hudY}px; opacity: ${g.hudOpacity};`
        : `right: 16px; top: 16px; opacity: ${g.hudOpacity};`;

      return `
        <div class="max-w-7xl mx-auto px-3 sm:px-6 py-4 space-y-3">
          <!-- 상단 문제 출제 카드 -->
          <div class="rounded-3xl p-4 sm:p-5 border-2 ${isRevival ? 'border-rose-400 ring-2 ring-rose-100' : theme.cardClass} shadow-sm space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex flex-wrap items-center gap-2">
                <span class="h-7 px-3 rounded-xl bg-slate-900 text-amber-300 text-[11px] font-black inline-flex items-center">
                  ${theme.badge}
                </span>
                <span class="h-7 px-3 rounded-xl ${isRevival ? 'bg-rose-600' : 'bg-blue-600'} text-white text-xs font-black inline-flex items-center">
                  ${isRevival ? '🔥 패자부활전 · ' : ''}문제 ${g.questionIndex + 1} / ${questions.length}
                </span>
                <span id="game-timer-badge" class="h-7 px-3 rounded-xl bg-slate-900 text-white text-xs font-black inline-flex items-center">
                  ${phase === 'ready' ? `대기 중 (${g.solveTimeSec}초)` : phase === 'revival_intro' ? '패자부활전 안내 중' : isRevealed ? `정답·이동 ${g.revealTimeLeft}초` : `남은 시간 ${g.timeLeft}초`}
                  ${g.paused ? ' (일시정지)' : ''}
                </span>
                <span class="h-7 px-3 rounded-xl bg-emerald-100 text-emerald-900 text-xs font-black inline-flex items-center">
                  생존 ${aliveCount}명 ${Number(g.targetSurvivors) > 0 ? `(목표 ${g.targetSurvivors}명)` : '(전체 완주)'}
                </span>
                ${isTeacherMonitor ? `
                  <span class="h-7 px-3 rounded-xl bg-amber-100 text-amber-900 border border-amber-300 text-xs font-black inline-flex items-center">
                    🔑 교사용 정답 미리보기: ${q.type === 'OX' ? q.options[q.answerIndex] : `${q.answerIndex + 1}번 (${q.options[q.answerIndex]})`}
                  </span>
                ` : `
                  <span class="h-7 px-3 rounded-xl bg-indigo-100 text-indigo-900 text-xs font-black inline-flex items-center">
                    📺 학생용 대형 화면 (정답 비공개)
                  </span>
                `}
              </div>
              ${isTeacherMonitor ? `
                <div class="flex items-center gap-1.5">
                  <button onclick="openStudentWindow()" class="h-8 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold">학생용 새 창 띄우기</button>
                  <button onclick="navigate('home')" class="h-8 px-3.5 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-extrabold">수업 종료</button>
                </div>
              ` : ''}
            </div>

            <h2 class="text-lg sm:text-2xl font-black ${g.theme === 'cyber' ? 'text-white' : 'text-slate-900'}">
              ${phase === 'ready' ? (isTeacherMonitor ? '교사 조작 리모컨에서 [문제 제시] 버튼을 누르면 학생 화면에 문제가 공개됩니다.' : '잠시 후 선생님이 문제를 제시합니다. 준비해 주세요!') : escapeHtml(q.question)}
            </h2>

            ${phase !== 'ready' ? `
              <div class="grid grid-cols-2 sm:grid-cols-${q.options.length} gap-2">
                ${q.options.map((opt, idx) => {
                  const isCorrect = (isRevealed || isTeacherMonitor) && q.answerIndex === idx;
                  const teacherHintOnly = isTeacherMonitor && !isRevealed && q.answerIndex === idx;
                  return `
                    <div class="p-3 rounded-2xl border text-xs sm:text-sm font-extrabold flex items-center justify-between gap-2 ${
                      isRevealed && q.answerIndex === idx
                        ? 'bg-emerald-600 text-white border-emerald-500 shadow'
                        : teacherHintOnly
                          ? 'bg-amber-50 text-amber-950 border-amber-400 ring-2 ring-amber-200'
                          : (g.theme === 'cyber' ? 'bg-indigo-900/80 text-cyan-100 border-cyan-500/40' : 'bg-white text-slate-800 border-slate-200')
                    }">
                      <span>${q.type === 'OX' ? '' : `${idx + 1}번. `}${escapeHtml(opt)}</span>
                      ${teacherHintOnly ? '<span class="px-2 py-0.5 rounded bg-amber-400 text-slate-950 text-[10px] font-black shrink-0">교사 정답</span>' : ''}
                      ${isRevealed && q.answerIndex === idx ? '<span class="px-2 py-0.5 rounded bg-white text-emerald-700 text-[10px] font-black shrink-0">정답</span>' : ''}
                    </div>
                  `;
                }).join('')}
              </div>
            ` : ''}

            ${(isRevealed || isTeacherMonitor) && q.explanation ? `
              <div class="p-3 rounded-2xl ${isRevealed ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-amber-50 border-amber-200 text-amber-950'} border text-xs font-bold">
                💡 ${isRevealed ? '해설' : '교사용 해설 미리보기'}: ${escapeHtml(q.explanation)}
              </div>
            ` : ''}
          </div>

          <!-- 카메라 & 머리 위 공중 플로팅 뱃지 캔버스 영역 -->
          <div id="play-stage-box" class="relative w-full ${isStudentDisplayMode ? 'h-[72vh]' : 'h-[58vh]'} min-h-[400px] rounded-3xl overflow-hidden border-2 border-slate-300 bg-slate-900 shadow-lg select-none">
            <video id="game-video" playsinline muted class="hidden"></video>
            <canvas id="game-canvas" class="w-full h-full block cursor-grab active:cursor-grabbing"></canvas>

            <!-- 패자부활전 / 전원 탈락 규칙 / 최종 우승 투명 카메라 오버레이 대형 텍스트 -->
            ${(phase === 'revival_intro' || phase === 'all_eliminated_alert' || phase === 'finished') ? `
              <div class="absolute inset-0 pointer-events-none flex flex-col items-center justify-center px-6 text-center z-20 ${phase === 'revival_intro' ? 'animate-revival-overlay' : ''}">
                <div class="text-4xl sm:text-7xl font-black tracking-tight text-amber-300 drop-shadow-[0_6px_18px_rgba(0,0,0,0.95)]" style="-webkit-text-stroke: 2px #0f172a;">
                  ${escapeHtml(g.specialBannerText)}
                </div>
                <div class="mt-3 text-base sm:text-2xl font-black text-white drop-shadow-[0_3px_10px_rgba(0,0,0,0.95)] max-w-3xl">
                  ${escapeHtml(g.specialBannerSub)}
                </div>
              </div>
            ` : ''}

            <!-- 교사 화면에서만 표시되는 드래그 및 투명도 조절 교사 조작 리모컨(HUD) -->
            ${isTeacherMonitor ? `
            <div
              id="teacher-control-hud"
              style="${hudStyle}"
              class="absolute z-30 w-[290px] sm:w-[320px] rounded-2xl bg-slate-950/90 backdrop-blur-md border border-white/20 text-white shadow-2xl p-3 space-y-2.5"
            >
              <div id="teacher-hud-drag-handle" class="cursor-move flex items-center justify-between gap-2 pb-2 border-b border-white/15">
                <span class="text-[11px] font-black text-amber-300 flex items-center gap-1">
                  ⠿ 교사 조작 리모컨 (드래그 이동)
                </span>
                <div class="flex items-center gap-1.5" onpointerdown="event.stopPropagation()">
                  <span class="text-[10px] text-slate-300 font-bold">투명도</span>
                  <input
                    type="range"
                    min="0.25"
                    max="1"
                    step="0.05"
                    value="${g.hudOpacity}"
                    oninput="const v=Number(this.value); state.game.hudOpacity=v; document.getElementById('teacher-control-hud').style.opacity=v; saveUserGamePrefs();"
                    class="w-16 accent-amber-400 cursor-pointer"
                  />
                </div>
              </div>

              <div class="grid grid-cols-2 gap-1.5">
                <button onclick="presentCurrentQuestion()" class="h-9 px-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-extrabold flex items-center justify-center whitespace-nowrap">
                  ▶ 문제 제시

                  ${g.paused ? '▶ 카운트 재개' : '⏸ 일시정지'}

                <button onclick="revealCurrentAnswer()" class="h-9 px-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold flex items-center justify-center whitespace-nowrap">

                </button>
                <button onclick="goToNextQuestion()" class="h-9 px-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-extrabold flex items-center justify-center whitespace-nowrap">
                  다음 문제 →
                </button>
              </div>

              <button onclick="state.game.showLiveSettings=!state.game.showLiveSettings; render(); initCameraAndGameLoop();" class="w-full h-8 rounded-xl bg-white/10 hover:bg-white/15 text-[11px] font-extrabold text-slate-200 flex items-center justify-center">
                ⚙ 실시간 진행 조건 조정 ${g.showLiveSettings ? '▲' : '▼'}
              </button>

              ${g.showLiveSettings ? `
                <div class="p-2.5 rounded-xl bg-black/50 border border-white/10 space-y-2 text-[11px]">
                  <div class="flex items-center justify-between gap-2">
                    <span class="text-slate-300 font-bold">풀이 시간</span>
                    <div class="flex items-center gap-1">
                      <input type="number" min="5" max="90" value="${g.solveTimeSec}" onchange="updateGamePref('solveTimeSec', Math.max(5, Number(this.value)), false)" class="w-14 px-2 py-1 rounded bg-slate-800 border border-slate-600 text-white font-black text-center" />

                    </div>

                  <div class="flex items-center justify-between gap-2">
                    <span class="text-slate-300 font-bold">카운트 소리 시작</span>
                    <div class="flex items-center gap-1">
                      <input type="number" min="0" max="20" value="${g.countdownSoundStartSec}" onchange="updateGamePref('countdownSoundStartSec', Math.max(0, Number(this.value)), false)" class="w-14 px-2 py-1 rounded bg-slate-800 border border-slate-600 text-white font-black text-center" />
                      <span>초 전</span>
                    </div>
                  </div>
                  <div class="flex items-center justify-between gap-2">
                    <span class="text-slate-300 font-bold">정답·이동 시간</span>

                      <input type="number" min="2" max="60" value="${g.revealMoveTimeSec}" onchange="updateGamePref('revealMoveTimeSec', Math.max(2, Number(this.value)), false)" class="w-14 px-2 py-1 rounded bg-slate-800 border border-slate-600 text-white font-black text-center" />
                      <span>초</span>
                    </div>
                  </div>
                  <div class="flex items-center justify-between gap-2 pt-1 border-t border-white/10">
                    <span class="text-slate-300 font-bold">문제 넘김</span>
                    <button onclick="updateGamePref('autoAdvance', !state.game.autoAdvance, true); initCameraAndGameLoop();" class="px-2.5 py-1 rounded-lg font-extrabold ${g.autoAdvance ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-200'}">
                      ${g.autoAdvance ? '자동 넘김' : '수동 넘김'}
                    </button>
                  </div>
                </div>
              ` : ''}
            </div>
            ` : ''}

            <div class="absolute bottom-3 left-3 right-3 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
              <span class="px-3 py-1.5 rounded-xl bg-slate-950/75 text-white text-[11px] font-bold">
                머리 위 공중 뱃지 표시 · 얇은 경계선(경고색/미선택) · 외곽 이탈(뱃지 깜빡임)
              </span>
              <span class="px-3 py-1.5 rounded-xl bg-slate-950/75 text-slate-200 text-[11px] font-bold">
                학생 위치를 드래그해 경계선·이탈 경고를 테스트할 수 있습니다
              </span>
